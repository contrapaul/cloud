<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud.</title>
<meta name="description" content="Build a word cloud together, live, on everyone's phone.">
<link rel="preload" href="fonts/BespokeSlab-Extrabold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Barlow-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/cloud.css">
</head>
<body class="has-foot">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">Cloud<span>.</span></a>
    <span class="muted tiny">Who even needs mentimeter, right?</span>
  </div>
</header>

<main class="wrap narrow stack">

  <div class="center" style="padding: var(--wc-s5) 0 var(--wc-s2);">
    <h1>Cloud<span style="color: var(--wc-accent)">.</span></h1>
    <p class="muted">A simple word cloud builder by Mr. K.</p>
  </div>

  <div id="err" class="err hidden"></div>

  <a class="btn" href="new/">Start a cloud</a>

  <section class="panel stack">
    <div>
      <label for="code">Join a cloud</label>
      <div class="row">
        <input type="text" id="code" maxlength="6" placeholder="ABC123"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               inputmode="text" style="font-family: var(--wc-num); letter-spacing: 0.1em;">
        <button type="button" class="btn shrink" id="join" style="width: 6rem;">Join</button>
      </div>
    </div>
    <p class="muted tiny">No sign up, no name, no personal data collected. Results saved locally.</p>
  </section>

  <section id="mine-panel" class="panel stack hidden">
    <h2>Your clouds</h2>
    <ul class="cloud-list" id="mine"></ul>
  </section>

</main>

<footer class="site-foot">
  A project by Mr. K. More at <a href="https://contrapaul.com">contrapaul.com</a>
</footer>

<script src="js/cloud-net.js"></script>
<script src="js/home.js"></script>
</body>
</html>
