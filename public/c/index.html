<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud</title>
<meta name="robots" content="noindex">
<link rel="preload" href="../fonts/BespokeSlab-Extrabold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/Barlow-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/cloud.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../">Cloud<span>.</span></a>
    <span class="muted tiny" id="head-title"></span>
    <span class="status" id="status" style="margin-left: auto;">connecting</span>
  </div>
</header>

<main class="wrap stack">

  <div id="err" class="err hidden"></div>

  <div class="center" style="padding-top: var(--wc-s4);">
    <h1 id="question"></h1>
    <p class="muted tiny" id="counts"></p>
  </div>

  <!-- The cloud as it stands, scaled down. Watching, not tapping. -->
  <section id="mini" class="field mini" aria-hidden="true"></section>

  <section class="compose stack" id="compose" hidden>
    <div class="row">
      <input type="text" id="entry" maxlength="40" placeholder="Type one thing"
             autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
      <button type="button" class="btn shrink" id="add" style="width: 5.5rem;">Add</button>
    </div>
    <div id="toast" class="toast hidden"></div>
  </section>

  <p class="tiny muted" id="tap-hint" hidden style="margin: 0;">Tap everything you are into as well</p>
  <section id="field" class="field uniform" aria-live="polite"></section>
  <p class="field-empty" id="field-empty">Connecting to the cloud.</p>

</main>

<script src="../js/cloud-net.js"></script>
<script src="../js/bubbles.js"></script>
<script src="../js/room.js"></script>
</body>
</html>
